<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c12" id="themeColorMeta" />
<title>Pulse — Modern Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app" id="app">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar">
    <header class="side-head">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        </div>
        <div class="brand-text"><strong>Pulse</strong><span>Chat</span></div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search chats and messages" autocomplete="off" />
      <button class="icon-btn clear-btn" id="clearSearch" hidden aria-label="Clear search">✕</button>
    </div>

    <button class="new-chat" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      <span>New chat</span>
    </button>

    <div class="chat-list" id="chatList"></div>

    <footer class="side-foot">
      <button class="profile-chip" id="profileBtn">
        <div class="avatar" id="myAvatar">A</div>
        <div class="profile-info">
          <div class="profile-name" id="myName">Alex</div>
          <div class="profile-status" id="myStatus">Available</div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ═══════════ CHAT AREA ═══════════ -->
  <main class="chat">

    <!-- Empty state -->
    <div class="empty" id="emptyState">
      <button class="icon-btn menu-btn" id="menuBtnEmpty" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="empty-art">
        <span class="orb o1"></span>
        <span class="orb o2"></span>
        <span class="orb o3"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
      </div>
      <h2>Welcome to Pulse</h2>
      <p>Pick a conversation to start chatting, or create a new one.</p>
      <button class="btn-primary" id="startChatEmpty">Start a new chat</button>
    </div>

    <!-- Active chat -->
    <div class="chat-view" id="chatView" hidden>
      <header class="chat-head">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="avatar md" id="chatAvatar">A</div>
        <div class="chat-info">
          <div class="chat-name" id="chatName">Chat</div>
          <div class="chat-status" id="chatStatus">
            <span class="dot"></span><span id="chatStatusText">offline</span>
          </div>
        </div>
        <div class="chat-head-actions">
          <button class="icon-btn" title="Search in chat" id="chatSearchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" title="More" id="chatMoreBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="typing-bar" id="typingBar" hidden>
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typingText">typing…</span>
      </div>

      <div class="composer-wrap">
        <div class="reply-bar" id="replyBar" hidden>
          <div class="reply-bar-inner">
            <div class="reply-bar-text">
              <div class="reply-bar-author" id="replyBarAuthor"></div>
              <div class="reply-bar-msg" id="replyBarMsg"></div>
            </div>
            <button class="icon-btn" id="cancelReply" aria-label="Cancel reply">✕</button>
          </div>
        </div>
        <div class="composer">
          <button class="icon-btn" id="emojiBtn" title="Emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="attachBtn" title="Attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L16 7"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="Message" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Overlays -->
<div class="backdrop" id="backdrop"></div>
<div class="emoji-picker" id="emojiPicker" hidden></div>
<div class="context-menu" id="contextMenu" hidden></div>
<div class="modal-overlay" id="modalOverlay" hidden><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx" />

<script src="script.js"></script>
</body>
</html>
